version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      all-dependencies:
        patterns:
          - "*"
  # Bumps the literal `node:24-trixie-slim`. A new Node major is a decision for a
  # person: the accessibility scanner of Maho needs Node 20 or later.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
